<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 4px;
            margin-bottom: 24px;
        }

        /* Input */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        .input-group button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            width: 46px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .input-group button:hover {
            background: #0284c7;
            color: #fff;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .filter-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .filter-btn.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        .todo-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .todo-item:hover {
            background: rgba(15, 23, 42, 0.8);
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 0.75rem;
            font-weight: bold;
            color: transparent;
        }

        .todo-item.completed .checkbox {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }

        .todo-text {
            font-size: 0.95rem;
            color: #e2e8f0;
            transition: 0.2s;
            word-break: break-word;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #334155;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .clear-btn:hover {
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <div class="header">
            <h2>Tasks</h2>
            <p id="date-display"></p>
        </div>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Tambah tugas baru..." autocomplete="off">
            <button id="add-btn">+</button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" id="filter-all">Semua</button>
            <button class="filter-btn" id="filter-active">Belum Selesai</button>
            <button class="filter-btn" id="filter-completed">Selesai</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div class="footer">
            <span id="task-count">0 tugas tersisa</span>
            <button id="clear-btn" class="clear-btn">Hapus yang selesai</button>
        </div>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';

        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const taskCount = document.getElementById('task-count');
        const dateDisplay = document.getElementById('date-display');
        const clearBtn = document.getElementById('clear-btn');

        const filterAll = document.getElementById('filter-all');
        const filterActive = document.getElementById('filter-active');
        const filterCompleted = document.getElementById('filter-completed');

        function setDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            const today = new Date();
            dateDisplay.innerText = today.toLocaleDateString('id-ID', options);
        }

        // Render Todo
        function render() {
            todoList.innerHTML = '';

            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `<li style="text-align: center; color: #64748b; padding: 20px 0; font-size: 0.85rem;">Tidak ada tugas</li>`;
            } else {
                filteredTodos.forEach((todo) => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    
                    li.innerHTML = `
                        <div class="todo-content" onclick="toggleTodo(${todo.id})">
                            <div class="checkbox">✓</div>
                            <span class="todo-text">${escapeHtml(todo.text)}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">✕</button>
                    `;

                    todoList.appendChild(li);
                });
            }

            updateStats();
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            todos.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            todoInput.value = '';
            render();
        }

        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            render();
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            render();
        }

        function setFilter(filter, activeBtn) {
            currentFilter = filter;
            [filterAll, filterActive, filterCompleted].forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
            render();
        }

        addBtn.addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        filterAll.addEventListener('click', () => setFilter('all', filterAll));
        filterActive.addEventListener('click', () => setFilter('active', filterActive));
        filterCompleted.addEventListener('click', () => setFilter('completed', filterCompleted));

        clearBtn.addEventListener('click', () => {
            todos = todos.filter(t => !t.completed);
            render();
        });

        function updateStats() {
            const activeCount = todos.filter(t => !t.completed).length;
            taskCount.innerText = `${activeCount} tugas tersisa`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        setDate();
        render();
    </script>
</body>
</html>
